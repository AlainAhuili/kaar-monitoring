persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# Auth settings below apply to all listeners
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Internal: ingest + simulator inside the Docker network (port is NOT published)
listener 1883

# External: gateways at client sites, TLS only
listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2

max_inflight_messages 100
max_queued_messages 10000
