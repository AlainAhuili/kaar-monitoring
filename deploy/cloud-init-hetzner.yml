#cloud-config
# Alternative paid host (about €5/month). Paste into "Cloud config" when creating the Hetzner server (Ubuntu 24.04, e.g. CX22).
# Replace the SSH public keys first.
groups:
  - docker

users:
  - name: deploy
    groups: [docker]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - ssh-ed25519 AAAA...your-laptop-key you@laptop
      - ssh-ed25519 AAAA...github-actions-deploy-key github-actions

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - rsync
  - ufw
  - fail2ban
  - unattended-upgrades

write_files:
  - path: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      KbdInteractiveAuthentication no
  - path: /etc/docker/daemon.json
    content: |
      { "log-driver": "json-file", "log-opts": { "max-size": "20m", "max-file": "5" } }

runcmd:
  # Docker from Docker's own repository (Ubuntu's compose package is too old for !reset/!override)
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - sh -c 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list'
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker deploy
  - ufw default deny incoming
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 8883/tcp
  - ufw --force enable
  - systemctl enable --now docker fail2ban
  - systemctl restart ssh
  - mkdir -p /opt/kaar && chown deploy:deploy /opt/kaar
  - sh -c '(crontab -u deploy -l 2>/dev/null; echo "17 4 * * 1 cd /opt/kaar && ./deploy/sync-mqtt-certs.sh >> /opt/kaar/certs.log 2>&1") | crontab -u deploy -'
