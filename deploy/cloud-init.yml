#cloud-config
# Paste into "Cloud config" when creating the Hetzner server (Ubuntu 24.04, e.g. CX22).
# Replace the SSH public keys first.
users:
  - name: deploy
    groups: [docker]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - ssh-ed25519 AAAA...your-laptop-key you@laptop
      - ssh-ed25519 AAAA...github-actions-deploy-key github-actions

package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - rsync
  - ufw
  - fail2ban
  - unattended-upgrades

write_files:
  - path: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      KbdInteractiveAuthentication no
  - path: /etc/docker/daemon.json
    content: |
      { "log-driver": "json-file", "log-opts": { "max-size": "20m", "max-file": "5" } }

runcmd:
  - ufw default deny incoming
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 8883/tcp
  - ufw --force enable
  - systemctl enable --now docker fail2ban
  - systemctl restart ssh
  - mkdir -p /opt/kaar && chown deploy:deploy /opt/kaar
  - (crontab -u deploy -l 2>/dev/null; echo '17 4 * * 1 cd /opt/kaar && ./deploy/sync-mqtt-certs.sh >> /opt/kaar/certs.log 2>&1') | crontab -u deploy -
