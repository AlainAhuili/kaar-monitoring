line-length = 110
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
  "S101",   # assert is fine in tests and for invariants
  "S311",   # random is fine for the simulator
  "S608",   # SQL is built with parameters, never with user strings
]

[lint.per-file-ignores]
"ingest/tests/*" = ["S105", "S106"]
